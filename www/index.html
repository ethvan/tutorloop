<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d9a85">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TutorLoop">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TutorLoop</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2a2e;--mute:#66757b;--line:#e2e0d8;--accent:#1d7a6b;--accent-ink:#fff;--soft:#e3f1ee;--warn:#fbeed3;--warn-ink:#7a5410;--lock:#f1e6f4;--lock-ink:#6a3a78;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--card:#1d2427;--ink:#e8eeef;--mute:#92a1a6;--line:#2c373b;--accent:#45b9a6;--accent-ink:#0b1b18;--soft:#1b3a35;--warn:#3b3016;--warn-ink:#f1cf85;--lock:#33263a;--lock-ink:#d9b5e6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191b;--card:#1d2427;--ink:#e8eeef;--mute:#92a1a6;--line:#2c373b;--accent:#45b9a6;--accent-ink:#0b1b18;--soft:#1b3a35;--warn:#3b3016;--warn-ink:#f1cf85;--lock:#33263a;--lock-ink:#d9b5e6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}h1 span{color:var(--accent)}
h2{font-size:16px;margin:0 0 8px}h3{font-size:13px;margin:12px 0 4px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
.tab,.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;cursor:pointer}
.tab.on,.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.skill{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;margin:6px 0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text],textarea,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:56px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin-top:8px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;margin-top:10px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--soft);margin:2px 4px 2px 0}
.tag.warn{background:var(--warn);color:var(--warn-ink)}.tag.lock{background:var(--lock);color:var(--lock-ink)}
.lesson{border-top:1px solid var(--line);padding:8px 0;font-size:14px}.lesson:first-child{border-top:0}
.mute{color:var(--mute);font-size:13px}
.banner{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
ul{margin:4px 0;padding-left:20px}
.goal{display:flex;gap:8px;align-items:center;margin:4px 0}
.row{display:flex;gap:8px}
:root{--c1:#1d9a85;--c2:#f2a33a;--c3:#6c5ce7;--c4:#e8567a;--c5:#2e9be6;--c6:#43b36b}
body{background:radial-gradient(900px 300px at 50% -80px,var(--soft),transparent),var(--bg)}
.logo{display:flex;align-items:center;gap:9px}
.logo h1{font-size:22px;letter-spacing:-.02em}
.hero{background:linear-gradient(135deg,#1d9a85,#6c5ce7 70%,#e8567a);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 6px 18px rgba(108,92,231,.25)}
.hero h2{margin:0;font-size:19px}.hero p{margin:2px 0 0;opacity:.92;font-size:13px}
.stats{display:flex;gap:8px}
.stat{background:rgba(255,255,255,.18);border-radius:14px;padding:6px 10px;text-align:center;min-width:70px;display:flex;flex-direction:column;align-items:center;justify-content:center}.stat b{font-size:20px;line-height:1.3}.stat span{font-size:11px;opacity:.92}
.card{box-shadow:0 2px 10px rgba(0,0,0,.05)}
.bar{height:10px}
.chart{width:100%;max-width:320px;display:block;margin:0 auto}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.tag{font-weight:500}
@media(max-width:700px){#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;flex-wrap:nowrap;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
#tabs .tab{border:0;background:transparent;flex:1;border-radius:12px;font-size:12px;padding:8px 4px}
#tabs .tab.on{background:var(--soft);color:var(--accent);font-weight:700}
.wrap{padding-bottom:90px}.hero{padding:14px}.stat{min-width:62px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><svg width="40" height="40" viewBox="0 0 48 48" aria-label="TutorLoop logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d9a85"/><stop offset="1" stop-color="#6c5ce7"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#lg)"/><path d="M33.5 15.5A12 12 0 1 0 36 27" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M31 25l9 .5-4.5 7z" fill="#fff"/><path d="M19 20h10M24 20v11" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/><circle cx="35" cy="13" r="3" fill="#ffd166"/></svg><h1>Tutor<span>Loop</span></h1></div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="chips" id="chips" style="margin-bottom:12px"></div>
<div id="app"></div>
<p class="mute" style="text-align:center;margin-top:20px">Prototype with sample data. Changes live only while this page is open.</p>
</div>
<script>
var SK=[["grammar","Grammar"],["vocab","Vocabulary"],["reading","Reading"],["writing","Writing"],["listening","Listening"],["speaking","Speaking"]];
var LV=["","Beginner","Developing","Intermediate","Confident","Advanced"];
var ACT={grammar:"Write five sentences using this week’s tense, then check them with your tutor.",vocab:"Make flashcards for 10 new words and use each one in a sentence.",reading:"Read a short article you enjoy and write a two-line summary.",writing:"Write a short paragraph about your weekend and underline your best sentence.",listening:"Watch a 3-minute video with subtitles off, then explain what happened.",speaking:"Record yourself talking for one minute about your day and listen back."};
var S={view:"tutor",sel:0,draft:{},students:[
{name:"Mia (pseudonym)",level:"Intermediate",skills:{grammar:3,vocab:4,reading:4,writing:2,listening:3,speaking:3},prev:{grammar:3,vocab:3,reading:4,writing:2,listening:3,speaking:2},approved:true,
 goals:[{t:"Use past tenses correctly in writing",d:false},{t:"Learn 40 STEM vocabulary words",d:true},{t:"Give a 2-minute talk on a science topic",d:false}],
 lessons:[{date:"Oct 21",covered:"Past simple vs. present perfect; lab report vocabulary",well:"Great use of new vocabulary in speaking",practice:"Mixing up past tenses in writing",hw:true,priv:"Gets frustrated when corrected in front of her brother.",shared:true},
 {date:"Oct 14",covered:"Reading a short physics article",well:"Strong at finding main ideas",practice:"Paragraph structure",hw:false,priv:"Parent asked about test prep.",shared:true}]},
{name:"Leo (pseudonym)",level:"Developing",skills:{grammar:2,vocab:3,reading:3,writing:2,listening:2,speaking:2},prev:{grammar:2,vocab:3,reading:3,writing:2,listening:2,speaking:2},approved:false,
 goals:[{t:"Describe a science experiment in 5 sentences",d:false}],
 lessons:[{date:"Oct 22",covered:"Sequence words: first, next, finally",well:"Confident reading aloud",practice:"Question forms",hw:true,priv:"Needs breaks every 20 min.",shared:true}]}
]};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cur(){return S.students[S.sel]}
function saveDraft(){var f=document.getElementById("lf");if(!f)return;S.draft={covered:f.covered.value,well:f.well.value,practice:f.practice.value,priv:f.priv.value,hw:f.hw.checked,shared:f.shared.checked}}
function go(v){saveDraft();S.view=v;render()}
function pick(i){saveDraft();S.sel=i;render()}
function toggleGoal(i){saveDraft();cur().goals[i].d=!cur().goals[i].d;render()}
function addGoal(){saveDraft();var el=document.getElementById("ng");if(el.value.trim()){cur().goals.push({t:el.value.trim(),d:false});render()}}
function setSkill(k,v){cur().skills[k]=+v;var l=document.getElementById("v_"+k);if(l)l.textContent=LV[v]}
function approve(){saveDraft();cur().approved=!cur().approved;render()}
function addLesson(e){e.preventDefault();var f=e.target;if(!f.covered.value.trim())return;
 cur().lessons.unshift({date:"Today",covered:f.covered.value,well:f.well.value,practice:f.practice.value,hw:f.hw.checked,priv:f.priv.value,shared:f.shared.checked});S.draft={};render()}
function ranked(s){return SK.slice().sort(function(a,b){return s.skills[b[0]]-s.skills[a[0]]})}
var SC=["#1d9a85","#f2a33a","#6c5ce7","#e8567a","#2e9be6","#43b36b"];
function radar(s){var n=6,cx=150,cy=150,R=90,g="";var pts=function(f){return SK.map(function(k,i){var a=-Math.PI/2+i*2*Math.PI/n,v=f(k[0])/5*R;return[cx+v*Math.cos(a),cy+v*Math.sin(a)]})};var j=function(a){return a.map(function(p){return p.join(",")}).join(" ")};
 for(var l=1;l<=5;l++){g+='<polygon points="'+j(pts(function(){return l}))+'" fill="none" stroke="var(--line)"/>'}
 var lab=SK.map(function(k,i){var a=-Math.PI/2+i*2*Math.PI/n;return '<text x="'+(cx+(R+26)*Math.cos(a))+'" y="'+(cy+(R+26)*Math.sin(a)+4)+'" text-anchor="middle" font-size="12" fill="var(--mute)">'+k[1]+'</text>'}).join("");
 return '<svg class="chart" viewBox="0 0 300 300">'+g+'<polygon points="'+j(pts(function(k){return s.prev[k]}))+'" fill="none" stroke="#f2a33a" stroke-width="2" stroke-dasharray="4 3"/><polygon points="'+j(pts(function(k){return s.skills[k]}))+'" fill="#1d9a85" fill-opacity=".28" stroke="#1d9a85" stroke-width="2.5"/>'+pts(function(k){return s.skills[k]}).map(function(p,i){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="'+SC[i]+'"/>'}).join("")+lab+'</svg><div class="legend"><span><i style="background:#1d9a85"></i>Now</span><span><i style="background:#f2a33a"></i>Last month</span></div>'}
function bars(s){return SK.map(function(k,i){return '<div class="skill"><span>'+k[1]+'</span><div class="bar"><i style="width:'+s.skills[k[0]]*20+'%;background:'+SC[i]+'"></i></div><span class="mute">'+LV[s.skills[k[0]]]+'</span></div>'}).join("")}
function ring(p){var c=2*Math.PI*26;return '<svg width="56" height="56" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="8"/><circle cx="32" cy="32" r="26" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(c*p)+' '+c+'" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">'+Math.round(p*100)+'%</text></svg>'}
function hero(s,sub){var avg=(SK.reduce(function(a,k){return a+s.skills[k[0]]},0)/6).toFixed(1),hw=s.lessons.filter(function(l){return l.hw}).length,gd=s.goals.filter(function(g){return g.d}).length,p=s.goals.length?gd/s.goals.length:0;
 return '<div class="hero"><div><h2>'+esc(s.name)+'</h2><p>'+sub+'</p></div><div class="stats"><div class="stat"><b>'+avg+'</b><span>Avg level</span></div><div class="stat"><b>'+hw+'/'+s.lessons.length+'</b><span>Homework</span></div><div class="stat">'+ring(p)+'<span>Goals</span></div></div></div>'}
function tutorView(s){var d=S.draft;
 var sk=SK.map(function(k){return '<div class="skill"><span>'+k[1]+'</span><input type="range" min="1" max="5" value="'+s.skills[k[0]]+'" oninput="setSkill(\''+k[0]+'\',this.value)"><span class="mute" id="v_'+k[0]+'">'+LV[s.skills[k[0]]]+'</span></div>'}).join("");
 var gl=s.goals.map(function(g,i){return '<div class="goal"><input type="checkbox" '+(g.d?"checked":"")+' onchange="toggleGoal('+i+')"><span>'+esc(g.t)+'</span></div>'}).join("");
 var hist=s.lessons.map(function(l){return '<div class="lesson"><b>'+esc(l.date)+'</b> · '+esc(l.covered)+'<br><span class="mute">Went well: '+esc(l.well||"—")+' · Practice: '+esc(l.practice||"—")+'</span><br>'+(l.hw?'<span class="tag">Homework done</span>':'<span class="tag warn">Homework not done</span>')+(l.shared?'<span class="tag">Shared</span>':'<span class="tag warn">Not shared</span>')+(l.priv?'<br><span class="tag lock">🔒 Private</span> <span class="mute">'+esc(l.priv)+'</span>':"")+'</div>'}).join("");
 return hero(s,'Level: '+esc(s.level))+'<div class="grid"><div>'+
 '<div class="card"><h2>Skill map</h2>'+radar(s)+'</div><div class="card"><h2>Assess skills</h2>'+sk+'<h3>Learning goals</h3>'+gl+'<div class="row" style="margin-top:8px"><input type="text" id="ng" placeholder="Add a goal"><button class="btn ghost" style="margin:0" onclick="addGoal()">Add</button></div></div>'+
 '<div class="card"><h2>Parent report</h2><p class="mute">Parents only see the report after you approve it.</p><span class="tag '+(s.approved?"":"warn")+'">'+(s.approved?"Approved and shared":"Draft, not shared")+'</span><br><button class="btn" onclick="approve()">'+(s.approved?"Withdraw approval":"Approve for sharing")+'</button></div></div><div>'+
 '<div class="card"><h2>Record a lesson (about 2 minutes)</h2><form id="lf" onsubmit="addLesson(event)">'+
 '<label>What was covered</label><textarea name="covered">'+esc(d.covered||"")+'</textarea>'+
 '<label>What went well</label><textarea name="well">'+esc(d.well||"")+'</textarea>'+
 '<label>What needs more practice</label><textarea name="practice">'+esc(d.practice||"")+'</textarea>'+
 '<label>🔒 Private tutor note (never shared)</label><textarea name="priv">'+esc(d.priv||"")+'</textarea>'+
 '<label><input type="checkbox" name="hw" '+(d.hw?"checked":"")+'> Homework completed</label>'+
 '<label><input type="checkbox" name="shared" '+(d.shared!==false?"checked":"")+'> Include in student and parent views</label>'+
 '<button class="btn" type="submit">Save lesson</button></form></div>'+
 '<div class="card"><h2>Student history</h2>'+hist+'</div></div></div>'}
function studentView(s){var r=ranked(s),str=r.slice(0,2),need=r.slice(-2).reverse();var done=s.goals.filter(function(g){return g.d}),todo=s.goals.filter(function(g){return !g.d});
 return hero(s,'Keep going, you’re doing great!')+'<div class="card"><h2>Your skill map</h2>'+radar(s)+bars(s)+'</div><div class="card"><h2>Hi '+esc(s.name.split(" ")[0])+'! Here’s how you’re doing</h2>'+
 '<h3>Your strengths</h3>'+str.map(function(k){return '<span class="tag">⭐ '+k[1]+' ('+LV[s.skills[k[0]]]+')</span>'}).join("")+
 '<h3>Let’s practice these</h3>'+need.map(function(k){return '<span class="tag warn">'+k[1]+'</span>'}).join("")+
 '<h3>Goals you’ve reached</h3>'+(done.length?'<ul>'+done.map(function(g){return '<li>✅ '+esc(g.t)+'</li>'}).join("")+'</ul>':'<p class="mute">Your first goal is coming soon!</p>')+
 '<h3>Still working on</h3><ul>'+todo.map(function(g){return '<li>'+esc(g.t)+'</li>'}).join("")+'</ul></div>'+
 '<div class="card"><h2>Try this week</h2><ul>'+need.map(function(k){return '<li><b>'+k[1]+':</b> '+ACT[k[0]]+'</li>'}).join("")+'</ul></div>'}
function parentView(s){
 if(!s.approved)return '<div class="banner">Parent view</div><div class="card"><h2>Report not ready yet</h2><p class="mute">The tutor is still reviewing this report. Check back soon.</p></div>';
 var up=SK.filter(function(k){return s.skills[k[0]]>s.prev[k[0]]}),r=ranked(s),need=r.slice(-2).reverse();
 var recent=s.lessons.filter(function(l){return l.shared}).slice(0,3);var hw=recent.filter(function(l){return l.hw}).length;
 var sum=esc(s.name.split(" ")[0])+' is working at the <b>'+esc(s.level)+'</b> level. '+(up.length?'Recent progress in '+up.map(function(k){return k[1].toLowerCase()}).join(" and ")+'. ':'Skills are steady this month. ')+'Homework was completed in '+hw+' of the last '+recent.length+' lessons.';
 return '<div class="banner">🔐 Secure, read-only page. Tutor-approved summary.</div>'+hero(s,'Tutor-approved report')+'<div class="card"><h2>Skill progress</h2>'+radar(s)+'</div><div class="card"><h2>Progress summary</h2><p>'+sum+'</p>'+
 '<h3>Recent improvements</h3>'+(up.length?up.map(function(k){return '<span class="tag">📈 '+k[1]+': '+LV[s.prev[k[0]]]+' → '+LV[s.skills[k[0]]]+'</span>'}).join(""):'<p class="mute">No level changes yet.</p>')+
 '<h3>Areas to improve</h3>'+need.map(function(k){return '<span class="tag warn">'+k[1]+'</span>'}).join("")+
 '<h3>Goals for the next few weeks</h3><ul>'+s.goals.filter(function(g){return !g.d}).map(function(g){return '<li>'+esc(g.t)+'</li>'}).join("")+'</ul>'+
 '<h3>Recent lessons</h3>'+recent.map(function(l){return '<div class="lesson"><b>'+esc(l.date)+'</b> · '+esc(l.covered)+'<br><span class="mute">Went well: '+esc(l.well||"—")+'</span></div>'}).join("")+'</div>'}
function render(){
 var T=[["tutor","📋 Tutor"],["student","🎓 Student"],["parent","👪 Parent"]];
 document.getElementById("tabs").innerHTML=T.map(function(t){return '<button class="tab '+(S.view===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
 document.getElementById("chips").innerHTML=S.students.map(function(s,i){return '<button class="chip '+(i===S.sel?"on":"")+'" onclick="pick('+i+')">'+esc(s.name.split(" ")[0])+'</button>'}).join("");
 var s=cur();document.getElementById("app").innerHTML=S.view==="tutor"?tutorView(s):S.view==="student"?studentView(s):parentView(s)}
try{var sv=localStorage.getItem("tutorloop");if(sv)S.students=JSON.parse(sv)}catch(e){}
var _r=render;render=function(){_r();try{localStorage.setItem("tutorloop",JSON.stringify(S.students))}catch(e){}};
render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
