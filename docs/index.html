<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d9a85">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TutorLoop">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TutorLoop</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2a2e;--mute:#66757b;--line:#e2e0d8;--accent:#1d7a6b;--accent-ink:#fff;--soft:#e3f1ee;--warn:#fbeed3;--warn-ink:#7a5410;--lock:#f1e6f4;--lock-ink:#6a3a78;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--card:#1d2427;--ink:#e8eeef;--mute:#92a1a6;--line:#2c373b;--accent:#45b9a6;--accent-ink:#0b1b18;--soft:#1b3a35;--warn:#3b3016;--warn-ink:#f1cf85;--lock:#33263a;--lock-ink:#d9b5e6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191b;--card:#1d2427;--ink:#e8eeef;--mute:#92a1a6;--line:#2c373b;--accent:#45b9a6;--accent-ink:#0b1b18;--soft:#1b3a35;--warn:#3b3016;--warn-ink:#f1cf85;--lock:#33263a;--lock-ink:#d9b5e6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}h1 span{color:var(--accent)}
h2{font-size:16px;margin:0 0 8px}h3{font-size:13px;margin:12px 0 4px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
.tab,.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;cursor:pointer}
.tab.on,.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.skill{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;margin:6px 0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text],textarea,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:56px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin-top:8px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;margin-top:10px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--soft);margin:2px 4px 2px 0}
.tag.warn{background:var(--warn);color:var(--warn-ink)}.tag.lock{background:var(--lock);color:var(--lock-ink)}
.lesson{border-top:1px solid var(--line);padding:8px 0;font-size:14px}.lesson:first-child{border-top:0}
.mute{color:var(--mute);font-size:13px}
.banner{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
ul{margin:4px 0;padding-left:20px}
.goal{display:flex;gap:8px;align-items:center;margin:4px 0}
.row{display:flex;gap:8px}
:root{--c1:#1d9a85;--c2:#f2a33a;--c3:#6c5ce7;--c4:#e8567a;--c5:#2e9be6;--c6:#43b36b}
body{background:radial-gradient(900px 300px at 50% -80px,var(--soft),transparent),var(--bg)}
.logo{display:flex;align-items:center;gap:9px}
.logo h1{font-size:22px;letter-spacing:-.02em}
.hero{background:linear-gradient(135deg,#1d9a85,#6c5ce7 70%,#e8567a);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 6px 18px rgba(108,92,231,.25)}
.hero h2{margin:0;font-size:19px}.hero p{margin:2px 0 0;opacity:.92;font-size:13px}
.stats{display:flex;gap:8px}
.stat{background:rgba(255,255,255,.18);border-radius:14px;padding:6px 10px;text-align:center;min-width:70px;display:flex;flex-direction:column;align-items:center;justify-content:center}.stat b{font-size:20px;line-height:1.3}.stat span{font-size:11px;opacity:.92}
.card{box-shadow:0 2px 10px rgba(0,0,0,.05)}
.bar{height:10px}
.chart{width:100%;max-width:320px;display:block;margin:0 auto}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.tag{font-weight:500}
@media(max-width:700px){#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;flex-wrap:nowrap;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
#tabs .tab{border:0;background:transparent;flex:1;border-radius:12px;font-size:12px;padding:8px 4px}
#tabs .tab.on{background:var(--soft);color:var(--accent);font-weight:700}
.wrap{padding-bottom:90px}.hero{padding:14px}.stat{min-width:62px}}
.skill{grid-template-columns:120px 1fr 90px}.sk{border-top:1px solid var(--line);padding:8px 0}.sk:first-of-type{border-top:0}.skill2{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin:4px 0}.sk input[type=text]{font-size:13px}.ic{border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;cursor:pointer;flex:none}
input[type=password]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><svg width="40" height="40" viewBox="0 0 48 48" aria-label="TutorLoop logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d9a85"/><stop offset="1" stop-color="#6c5ce7"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#lg)"/><path d="M33.5 15.5A12 12 0 1 0 36 27" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M31 25l9 .5-4.5 7z" fill="#fff"/><path d="M19 20h10M24 20v11" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none"/><circle cx="35" cy="13" r="3" fill="#ffd166"/></svg><h1>Tutor<span>Loop</span></h1></div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="chips" id="chips" style="margin-bottom:12px"></div>
<div id="app"></div>
<p class="mute" style="text-align:center;margin-top:20px">Prototype with sample data, saved on this device only.</p>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
var LV=["","Exploring","Growing","Getting there","Strong","Shining"];
var SC=["#1d9a85","#f2a33a","#6c5ce7","#e8567a","#2e9be6","#43b36b","#e07b39","#8e6bd1"];
var S={view:"tutor",sel:0,draft:{},students:[
{name:"Mia (pseudonym)",subject:"Algebra",approved:true,
 skills:[{n:"Solving equations",v:4,p:3,f:false,tip:""},{n:"Word problems",v:2,p:2,f:true,tip:"Underline the question, then draw a quick picture."},{n:"Showing steps",v:3,p:2,f:true,tip:"Write one line per step, like a recipe."},{n:"Reading graphs",v:4,p:4,f:false,tip:""}],
 lessons:[{date:"Oct 21",covered:"Two-step equations and checking answers",well:"Checked her own work without being asked",practice:"Turning word problems into equations",hw:true,priv:"Gets frustrated when corrected in front of her brother.",shared:true},
 {date:"Oct 14",covered:"Slope and reading line graphs",well:"Quick at spotting patterns",practice:"Writing out each step",hw:false,priv:"Parent asked about test prep.",shared:true}]},
{name:"Leo (pseudonym)",subject:"Chemistry",approved:false,
 skills:[{n:"Lab safety",v:4,p:4,f:false,tip:""},{n:"Balancing equations",v:2,p:2,f:true,tip:"Count atoms on each side with a tally chart."},{n:"Explaining ideas",v:3,p:2,f:false,tip:""}],
 lessons:[{date:"Oct 22",covered:"Atoms, molecules and simple reactions",well:"Great questions during the demo",practice:"Balancing equations",hw:true,priv:"Needs breaks every 20 min.",shared:true}]}
]};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cur(){return S.students[S.sel]}
function save(){if(CLOUD){cloudSave()}else{try{localStorage.setItem("tutorloop2",JSON.stringify(S.students))}catch(e){}}}
function saveDraft(){var f=document.getElementById("lf");if(!f)return;S.draft={covered:f.covered.value,well:f.well.value,practice:f.practice.value,priv:f.priv.value,hw:f.hw.checked,shared:f.shared.checked}}
function go(v){saveDraft();S.view=v;render()}
function pick(i){saveDraft();S.sel=i;render()}
function setSkill(i,v){cur().skills[i].v=+v;var l=document.getElementById("v_"+i);if(l)l.textContent=LV[v];save()}
function rename(i,v){if(v.trim()){cur().skills[i].n=v.trim();save()}}
function setTip(i,v){cur().skills[i].tip=v;save()}
function setSubject(v){cur().subject=v;save()}
function toggleFocus(i){saveDraft();cur().skills[i].f=!cur().skills[i].f;render()}
function delSkill(i){saveDraft();cur().skills.splice(i,1);render()}
function addSkill(){saveDraft();var el=document.getElementById("ns");if(el.value.trim()){cur().skills.push({n:el.value.trim(),v:2,p:2,f:false,tip:""});render()}}
function snapshot(){saveDraft();cur().skills.forEach(function(k){k.p=k.v});render()}
function approve(){saveDraft();cur().approved=!cur().approved;render()}
function addLesson(e){e.preventDefault();var f=e.target;if(!f.covered.value.trim())return;
 cur().lessons.unshift({id:uid(),date:"Today",covered:f.covered.value,well:f.well.value,practice:f.practice.value,hw:f.hw.checked,priv:f.priv.value,shared:f.shared.checked});S.draft={};render()}
function radar(s){var K=s.skills,n=K.length;if(n<3)return bars(s);var cx=150,cy=150,R=85;
 var pt=function(i,v){var a=-Math.PI/2+i*2*Math.PI/n,r=v/5*R;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
 var poly=function(f){return K.map(function(k,i){return pt(i,f(k)).join(",")}).join(" ")};
 var g="";for(var l=1;l<=5;l++)g+='<polygon points="'+poly(function(){return l})+'" fill="none" stroke="var(--line)"/>';
 var lab=K.map(function(k,i){var a=-Math.PI/2+i*2*Math.PI/n,c=Math.cos(a),t=k.n.length>16?k.n.slice(0,15)+"…":k.n;return '<text x="'+(cx+(R+12)*c)+'" y="'+(cy+(R+14)*Math.sin(a)+4)+'" text-anchor="'+(c>0.3?"start":c<-0.3?"end":"middle")+'" font-size="11" fill="var(--mute)">'+esc(t)+'</text>'}).join("");
 var dots=K.map(function(k,i){var p=pt(i,k.v);return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="'+SC[i%SC.length]+'"/>'}).join("");
 return '<svg class="chart" viewBox="-60 -5 420 310">'+g+'<polygon points="'+poly(function(k){return k.p})+'" fill="none" stroke="#f2a33a" stroke-width="2" stroke-dasharray="4 3"/><polygon points="'+poly(function(k){return k.v})+'" fill="#1d9a85" fill-opacity=".28" stroke="#1d9a85" stroke-width="2.5"/>'+dots+lab+'</svg><div class="legend"><span><i style="background:#1d9a85"></i>Now</span><span><i style="background:#f2a33a"></i>Where we started</span></div>'}
function bars(s){return s.skills.map(function(k,i){return '<div class="skill"><span>'+esc(k.n)+'</span><div class="bar"><i style="width:'+k.v*20+'%;background:'+SC[i%SC.length]+'"></i></div><span class="mute">'+LV[k.v]+'</span></div>'}).join("")}
function ring(p){var c=2*Math.PI*26;return '<svg width="56" height="56" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="8"/><circle cx="32" cy="32" r="26" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(c*p)+' '+c+'" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">'+Math.round(p*100)+'%</text></svg>'}
function hero(s,sub){var n=s.lessons.length,hw=s.lessons.filter(function(l){return l.hw}).length,grew=s.skills.filter(function(k){return k.v>k.p}).length;
 return '<div class="hero"><div><h2>'+esc(s.name)+'</h2><p>'+sub+'</p></div><div class="stats"><div class="stat"><b>'+grew+' 🌱</b><span>Skills grew</span></div><div class="stat"><b>'+n+'</b><span>Lessons</span></div><div class="stat">'+ring(n?hw/n:0)+'<span>Homework</span></div></div></div>'}
function tutorView(s){var d=S.draft;
 var sk=s.skills.map(function(k,i){return '<div class="sk"><div class="row"><input type="text" value="'+esc(k.n)+'" onchange="rename('+i+',this.value)"><button class="ic" title="Focus for next lessons" onclick="toggleFocus('+i+')">'+(k.f?"🎯":"○")+'</button><button class="ic" title="Remove skill" onclick="delSkill('+i+')">✕</button></div><div class="skill2"><input type="range" min="1" max="5" value="'+k.v+'" oninput="setSkill('+i+',this.value)"><span class="mute" id="v_'+i+'">'+LV[k.v]+'</span></div><input type="text" placeholder="Tip or activity for the student (optional)" value="'+esc(k.tip)+'" onchange="setTip('+i+',this.value)"></div>'}).join("");
 var hist=s.lessons.map(function(l){return '<div class="lesson"><b>'+esc(l.date)+'</b> · '+esc(l.covered)+'<br><span class="mute">Went well: '+esc(l.well||"—")+' · Next time: '+esc(l.practice||"—")+'</span><br>'+(l.hw?'<span class="tag">Homework done</span>':'<span class="tag warn">Homework not done</span>')+(l.shared?'<span class="tag">Shared</span>':'<span class="tag warn">Not shared</span>')+(l.priv?'<br><span class="tag lock">🔒 Private</span> <span class="mute">'+esc(l.priv)+'</span>':"")+'</div>'}).join("");
 return hero(s,esc(s.subject))+'<div class="grid"><div>'+
 '<div class="card"><h2>Skill map</h2>'+(s.skills.length?radar(s):'<p class="mute">Add a skill to see the map.</p>')+'</div>'+
 '<div class="card"><h2>Skills you’re tracking</h2><label>Subject or focus</label><input type="text" value="'+esc(s.subject)+'" onchange="setSubject(this.value)"><p class="mute">Name any skill. 🎯 marks what to focus on next.</p>'+sk+'<div class="row" style="margin-top:8px"><input type="text" id="ns" placeholder="Add a skill, e.g. Lab reports"><button class="btn ghost" style="margin:0" onclick="addSkill()">Add</button></div><button class="btn ghost" onclick="snapshot()">Start a new month</button><p class="mute">“Start a new month” resets the starting point so growth shows from today.</p></div>'+
 '<div class="card"><h2>Parent report</h2><p class="mute">Parents only see the report after you approve it.</p><span class="tag '+(s.approved?"":"warn")+'">'+(s.approved?"Approved and shared":"Draft, not shared")+'</span><br><button class="btn" onclick="approve()">'+(s.approved?"Withdraw approval":"Approve for sharing")+'</button>'+(CLOUD?' <button class="btn ghost" onclick="share(\'parent\')">Copy parent link</button> <button class="btn ghost" onclick="share(\'student\')">Copy student link</button>':'')+'</div></div><div>'+
 '<div class="card"><h2>Record a lesson (about 2 minutes)</h2><form id="lf" onsubmit="addLesson(event)">'+
 '<label>What was covered</label><textarea name="covered">'+esc(d.covered||"")+'</textarea>'+
 '<label>What went well</label><textarea name="well">'+esc(d.well||"")+'</textarea>'+
 '<label>What to work on next</label><textarea name="practice">'+esc(d.practice||"")+'</textarea>'+
 '<label>🔒 Private tutor note (never shared)</label><textarea name="priv">'+esc(d.priv||"")+'</textarea>'+
 '<label><input type="checkbox" name="hw" '+(d.hw?"checked":"")+'> Homework completed</label>'+
 '<label><input type="checkbox" name="shared" '+(d.shared!==false?"checked":"")+'> Include in student and parent views</label>'+
 '<button class="btn" type="submit">Save lesson</button></form></div>'+
 '<div class="card"><h2>Student history</h2>'+hist+'</div></div></div>'}
function nextList(s){var f=s.skills.filter(function(k){return k.f});return f.length?'<ul>'+f.map(function(k){return '<li><b>'+esc(k.n)+':</b> '+(k.tip?esc(k.tip):'we’ll keep building this together')+'</li>'}).join("")+'</ul>':'<p class="mute">Your tutor will add next steps soon.</p>'}
function studentView(s){var str=s.skills.filter(function(k){return k.v>=4}),grew=s.skills.filter(function(k){return k.v>k.p});
 return hero(s,'Keep going, you’re doing great!')+'<div class="card"><h2>Your skill map</h2>'+(s.skills.length?radar(s):"")+'</div><div class="card"><h2>Hi '+esc(s.name.split(" ")[0])+'! Here’s how you’re growing</h2>'+
 '<h3>Your strengths</h3>'+(str.length?str.map(function(k){return '<span class="tag">⭐ '+esc(k.n)+'</span>'}).join(""):'<p class="mute">You’re building lots of skills!</p>')+
 '<h3>Where you’ve grown</h3>'+(grew.length?grew.map(function(k){return '<span class="tag">🌱 '+esc(k.n)+'</span>'}).join(""):'<p class="mute">Keep going, growth is on the way.</p>')+
 '<h3>What we’re building next</h3>'+nextList(s)+'</div>'}
function parentView(s){
 if(!s.approved)return '<div class="banner">Parent view</div><div class="card"><h2>Report not ready yet</h2><p class="mute">The tutor is still reviewing this report. Check back soon.</p></div>';
 var grew=s.skills.filter(function(k){return k.v>k.p}),str=s.skills.filter(function(k){return k.v>=4}),recent=s.lessons.filter(function(l){return l.shared}).slice(0,3),hw=recent.filter(function(l){return l.hw}).length;
 var sum=esc(s.name.split(" ")[0])+' is working on <b>'+esc(s.subject)+'</b>. '+(grew.length?'Recent growth in '+grew.map(function(k){return esc(k.n.toLowerCase())}).join(" and ")+'. ':'Skills are holding steady. ')+'Homework was completed in '+hw+' of the last '+recent.length+' lessons.';
 return '<div class="banner">🔐 Secure, read-only page. Tutor-approved summary.</div>'+hero(s,'Tutor-approved report')+'<div class="card"><h2>Skill progress</h2>'+(s.skills.length?radar(s):"")+'</div><div class="card"><h2>Progress summary</h2><p>'+sum+'</p>'+
 '<h3>Strengths</h3>'+(str.length?str.map(function(k){return '<span class="tag">⭐ '+esc(k.n)+'</span>'}).join(""):'<p class="mute">Building a solid foundation.</p>')+
 '<h3>Recent growth</h3>'+(grew.length?grew.map(function(k){return '<span class="tag">🌱 '+esc(k.n)+': '+LV[k.p]+' → '+LV[k.v]+'</span>'}).join(""):'<p class="mute">No changes yet this month.</p>')+
 '<h3>Focus for the next few weeks</h3>'+nextList(s)+
 '<h3>Recent lessons</h3>'+recent.map(function(l){return '<div class="lesson"><b>'+esc(l.date)+'</b> · '+esc(l.covered)+'<br><span class="mute">Went well: '+esc(l.well||"—")+'</span></div>'}).join("")+'</div>'}
function render(){
 var T=[["tutor","📋 Tutor"],["student","🎓 Student"],["parent","👪 Parent"]];
 document.getElementById("tabs").innerHTML=T.map(function(t){return '<button class="tab '+(S.view===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
 document.getElementById("chips").innerHTML=S.students.map(function(s,i){return '<button class="chip '+(i===S.sel?"on":"")+'" onclick="pick('+i+')">'+esc(s.name.split(" ")[0])+'</button>'}).join("")+(CLOUD?'<button class="chip" onclick="addStudent()">+ Student</button><button class="chip" onclick="signOut()">Sign out</button>':"");
 var s=cur();if(!s){document.getElementById("app").innerHTML='<div class="card"><h2>Welcome</h2><p class="mute">Tap “+ Student” to add your first student.</p></div>';return}document.getElementById("app").innerHTML=S.view==="tutor"?tutorView(s):S.view==="student"?studentView(s):parentView(s)}
var CLOUD=null,sb=null,me=null,cfg=window.TL_CONFIG||{},_t;
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}
async function pushAll(){for(var s of S.students){if(!s.id)s.id=uid();var notes={};
 var pub=s.lessons.map(function(l){l.id=l.id||uid();notes[l.id]=l.priv||"";return{id:l.id,date:l.date,covered:l.covered,well:l.well,practice:l.practice,hw:l.hw,shared:l.shared}});
 var a=await sb.from("students").upsert({id:s.id,tutor_id:me.id,name:s.name,subject:s.subject,approved:s.approved,skills:s.skills,lessons:pub});
 var b=await sb.from("private_notes").upsert({student_id:s.id,tutor_id:me.id,notes:notes});
 if(a.error||b.error)console.error(a.error||b.error)}}
function cloudSave(){clearTimeout(_t);_t=setTimeout(pushAll,600)}
async function loadAll(){var a=await sb.from("students").select("*").order("created_at"),b=await sb.from("private_notes").select("*"),nm={};
 (b.data||[]).forEach(function(r){nm[r.student_id]=r.notes});
 S.students=(a.data||[]).map(function(r){return{id:r.id,name:r.name,subject:r.subject,approved:r.approved,skills:r.skills,lessons:r.lessons.map(function(l){l.priv=(nm[r.id]||{})[l.id]||"";return l})}});S.sel=0;render()}
function addStudent(){var n=prompt("Student name or pseudonym");if(!n)return;S.students.push({id:uid(),name:n,subject:"",approved:false,skills:[],lessons:[]});S.sel=S.students.length-1;render()}
async function share(role){clearTimeout(_t);await pushAll();var t=Array.from(crypto.getRandomValues(new Uint8Array(24))).map(function(b){return b.toString(16).padStart(2,"0")}).join("");
 var r=await sb.from("shares").insert({token:t,student_id:cur().id,role:role,expires_at:new Date(Date.now()+90*864e5).toISOString()});
 if(r.error){alert(r.error.message);return}
 var u=(cfg.siteUrl||location.origin+location.pathname)+"?r="+t;
 try{await navigator.clipboard.writeText(u);alert("Link copied. It expires in 90 days.")}catch(e){prompt("Copy this link",u)}}
function loginView(msg){document.getElementById("tabs").innerHTML="";document.getElementById("chips").innerHTML="";
 document.getElementById("app").innerHTML='<div class="card" style="max-width:380px;margin:20px auto"><h2>Tutor sign in</h2><label>Email</label><input type="text" id="em" autocapitalize="none"><label>Password</label><input type="password" id="pw"><button class="btn" onclick="auth(false)">Sign in</button> <button class="btn ghost" onclick="auth(true)">Create account</button><p class="mute" id="am">'+(msg||"")+'</p></div>'}
async function auth(up){var e=document.getElementById("em").value.trim(),p=document.getElementById("pw").value,am=document.getElementById("am");
 var r=up?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});
 if(r.error){am.textContent=r.error.message;return}
 if(!r.data.session){am.textContent="Check your email to confirm, then sign in.";return}
 start(r.data.session)}
async function start(sess){me=sess.user;CLOUD=true;await loadAll()}
async function signOut(){await sb.auth.signOut();CLOUD=null;S.students=[];loginView()}
async function boot(){var tok=new URLSearchParams(location.search).get("r");
 if(cfg.url&&cfg.key&&window.supabase){sb=supabase.createClient(cfg.url,cfg.key);
  if(tok){document.getElementById("tabs").innerHTML="";document.getElementById("chips").innerHTML="";
   var r=await sb.rpc("get_shared",{p_token:tok}),el=document.getElementById("app");
   if(r.error||!r.data){el.innerHTML='<div class="card"><h2>This link is no longer valid</h2><p class="mute">Please ask your tutor for a new one.</p></div>'}
   else{S.students=[r.data];S.sel=0;el.innerHTML=(r.data.role==="parent"?parentView:studentView)(r.data)}return}
  var g=await sb.auth.getSession();if(g.data.session){start(g.data.session)}else{loginView()}return}
 try{var sv=localStorage.getItem("tutorloop2");if(sv)S.students=JSON.parse(sv)}catch(e){}
 render()}
var _r=render;render=function(){_r();save()};
boot();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
